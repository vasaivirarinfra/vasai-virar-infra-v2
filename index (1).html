const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),safe=u=>/^https?:\/\//.test(u||'')?esc(u):'#';
const cr=n=>n==null?'—':'₹'+Number(n).toLocaleString('en-IN')+' Cr',dt=d=>d?new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';

const ST=['Proposed','Approved','Under Construction','Completed','Delayed'],TS=['Open','Closed','Awarded','Cancelled'],NT=['Official announcement','Media report','Independent analysis'],TRS=['Completed','In Progress','Not Started','Not Applicable'],DT=['PDF','EIA report','Proposal','Map','Photo','Other'];
let sb,ROLE=null,SES=null,CATS=[],F={page:1},V={},AD={tab:'projects',edit:null},PROJ=[],LD=()=>{},M=null;const PS=10;

const sf=(k,v)=>{F[k]=v;F.page=1;LD()},pgo=n=>{F.page=n;LD()},pager=t=>{const n=Math.max(1,Math.ceil(t/PS));return `<div class=pg><button class=s ${F.page<2?'disabled':''} onclick="pgo(${F.page-1})">‹ Prev</button><span>Page ${F.page} of ${n} · ${t} results</span><button class=s ${F.page>=n?'disabled':''} onclick="pgo(${F.page+1})">Next ›</button></div>`};

const docs=a=>(a||[]).map(d=>{const u=d.file_path?pub(d.file_path):d.external_url;return d.doc_type==='Photo'&&d.file_path?`<a href="${safe(u)}" target=_blank rel=noopener><img class=pimg src="${esc(u)}" alt="${esc(d.title)}" loading=lazy></a>`:`<div>${d.doc_type==='PDF'?'📄':'🔗'} <a href="${safe(u)}" target=_blank rel=noopener>${esc(d.title)}</a> <small>${esc(d.doc_type)}</small></div>`}).join('')||'<span class=mu>None added yet.</span>';
/* ---------- public views ---------- */
const R={},AFT={};
R.home=async()=>{const s=(await ok(sb.from('dashboard_stats').select('*').single())).data,pr=(await ok(sb.from('projects').select(PSEL).order('updated_at',{ascending:false}).limit(6))).data,nw=(await ok(sb.from('news').select('id,headline,source_type,published_on,source_name,summary').order('published_on',{ascending:false}).limit(3))).data;
const K=[['Total projects',s.total_projects],['Under construction',s.under_construction],['Completed',s.completed],['Proposed / approved',s.proposed],['Delayed',s.delayed],['Active tenders',s.active_tenders],['Estimated value',cr(s.total_value_cr)]];
return `<div class=hero><h1>VasaiVirarInfra</h1><p>Tracking Development. Connecting Communities.</p></div><div class="g g4">${K.map(([l,v])=>`<div class=card><div class=k>${v}<small>${l}</small></div></div>`).join('')}</div><h2 style="margin-top:18px">Recently updated projects</h2><div class="g g3">${pr.map(pc).join('')||'<p class=mu>No projects yet. Add the first one in Admin.</p>'}</div><h2 style="margin-top:18px">Latest news</h2><div class="g g3">${nw.map(n=>`<a class=card href="#/article/${n.id}">${chip(n.source_type)}<br><b>${esc(n.headline)}</b><br><small>${dt(n.published_on)} · ${esc(n.source_name)}</small><p class=mu>${esc(n.summary)}</p></a>`).join('')||'<p class=mu>No news yet.</p>'}</div>`};
R.projects=async()=>{const a=(await ok(sb.from('projects').select('authority,location'))).data;LD=async()=>{let r=sb.from('projects').select(PSEL,{count:'exact'});if(F.q){const q=cl(F.q);r=r.or(`name.ilike.%${q}%,location.ilike.%${q}%,authority.ilike.%${q}%,description.ilike.%${q}%`)}
if(F.cat)r=r.eq('category_id',F.cat);if(F.st)r=r.eq('status',F.st);if(F.au)r=r.eq('authority',F.au);if(F.lo)r=r.eq('location',F.lo);const s=F.sort||'updated_at';r=r.order(s,{ascending:s==='name'||s==='expected_completion',nullsFirst:false}).range((F.page-1)*PS,F.page*PS-1);const x=await ok(r);$('#res').innerHTML=`<div class="g g3">${x.data.map(pc).join('')||'<p class=mu>No projects match.</p>'}</div>${pager(x.count)}`};AFT.projects=LD;
const u=k=>[...new Set(a.map(x=>x[k]).filter(Boolean))].sort();return `<h1>Infrastructure projects</h1><div class=fb>${inp('q','Search name, location, authority…')}${sel('cat','All categories',CATS.map(c=>[c.id,c.name]))}${sel('st','All statuses',ST)}${sel('au','All authorities',u('authority'))}${sel('lo','All locations',u('location'))}<select onchange="sf('sort',this.value)" aria-label=Sort><option value=updated_at>Recently updated</option><option value=name>Name</option><option value=cost_cr>Cost</option><option value=expected_completion>Completion date</option></select></div><div id=res></div>`};
R.project=async id=>{const p=(await ok(sb.from('projects').select('*,categories(name),project_tracks(*),project_updates(*),project_facts(*),documents(*),project_tenders(tenders(*))').eq('id',id).maybeSingle())).data;if(!p)return '<h1>Not found</h1><a href="#/projects">Back</a>';
const tr=Object.keys(TR).map(k=>p.project_tracks.find(t=>t.track===k)||{track:k,status:'Not Started',percent:0});
return `<a href="#/projects">← All projects</a><h1>${ic(p.categories?.name)} ${esc(p.name)} ${p.is_demo?'<span class="ch mu">DEMO</span>':''}</h1>${chip(p.status)}<span class=ch>${esc(p.categories?.name||'')}</span>
<div class="g g2"><div class=card><h3>Overview</h3><p>${esc(p.description)}</p><p><b>Location:</b> ${esc(p.location)}, ${esc(p.district)} (${p.lat??'—'}, ${p.lng??'—'})<br><b>Authority:</b> ${esc(p.authority)}<br><b>Estimated cost:</b> ${cr(p.cost_cr)}<br><b>Expected completion:</b> ${dt(p.expected_completion)} <small>(a target, not an announced date)</small></p>
<h3>Sourced facts</h3>${p.project_facts.map(f=>`<p><b>${esc(f.label)}:</b> ${esc(f.detail)} <span class="gr ${SC[f.grade]}">${esc(f.grade)}</span> ${f.source_url?`<a href="${safe(f.source_url)}" target=_blank rel=noopener>source ↗</a>`:''}</p>`).join('')||'<span class=mu>None added yet.</span>'}</div>
<div class=card><h3>Progress tracking</h3>${tr.map(t=>`<div style="margin:10px 0"><b>${TR[t.track]}</b> ${chip(t.status)}<div class=bar><i style="width:${t.percent}%"></i></div><small>${t.percent}%${t.note?' · '+esc(t.note):''}</small></div>`).join('')}</div></div>
<div class="g g2" style="margin-top:12px"><div class=card><h3>Photographs, documents &amp; links</h3>${docs(p.documents)}</div><div class=card><h3>Update history</h3><div class=tl>${[...p.project_updates].sort((a,b)=>b.created_at.localeCompare(a.created_at)).map(u=>`<div><small>${dt(u.created_at)}${u.track?' · '+TR[u.track]:''}</small><br>${esc(u.note)} ${u.source_url?`<a href="${safe(u.source_url)}" target=_blank rel=noopener>source ↗</a>`:''}</div>`).join('')||'<span class=mu>No updates yet.</span>'}</div></div></div>
<div class=card style="margin-top:12px"><h3>Related tenders</h3>${p.project_tenders.map(x=>x.tenders).map(t=>`<p><b>${esc(t.title)}</b> ${chip(t.status)}<br><small>${esc(t.tender_ref)} · deadline ${dt(t.deadline)} ${t.official_url?`· <a href="${safe(t.official_url)}" target=_blank rel=noopener>official</a>`:''}</small></p>`).join('')||'<span class=mu>None linked.</span>'}</div>`};
R.tenders=async()=>{LD=async()=>{let r=sb.from('tenders').select('*,documents(*),project_tenders(projects(id,name))',{count:'exact'});if(F.q){const q=cl(F.q);r=r.or(`title.ilike.%${q}%,tender_ref.ilike.%${q}%,department.ilike.%${q}%,location.ilike.%${q}%`)}if(F.st)r=r.eq('status',F.st);const s=F.sort||'deadline';r=r.order(s,{ascending:s==='deadline',nullsFirst:false}).range((F.page-1)*PS,F.page*PS-1);const x=await ok(r);

R.news=async()=>{LD=async()=>{let r=sb.from('news').select('id,headline,summary,source_type,source_name,published_on,location,image_path,is_demo',{count:'exact'});if(F.q){const q=cl(F.q);r=r.or(`headline.ilike.%${q}%,summary.ilike.%${q}%,location.ilike.%${q}%`)}if(F.st)r=r.eq('source_type',F.st);r=r.order('published_on',{ascending:false}).range((F.page-1)*PS,F.page*PS-1);const x=await ok(r);
$('#res').innerHTML=`<div class="g g3">${x.data.map(n=>`<a class=card href="#/article/${n.id}">${n.image_path?`<img class=pimg src="${esc(pub(n.image_path))}" alt="" loading=lazy>`:''}${chip(n.source_type)}${n.is_demo?'<span class="ch mu">DEMO</span>':''}<br><b>${esc(n.headline)}</b><br><small>${dt(n.published_on)} · ${esc(n.location||'')} · ${esc(n.source_name)}</small><p class=mu>${esc(n.summary)}</p></a>`).join('')||'<p class=mu>No articles.</p>'}</div>${pager(x.count)}`};AFT.news=LD;return `<h1>News &amp; civic updates</h1><div class=fb>${inp('q','Search news…')}${sel('st','All source types',NT)}</div><div id=res></div>`};

R.plans=async()=>{const p=(await ok(sb.from('plans').select('*,documents(id),plan_projects(project_id)').order('name'))).data;return `<h1>Development plans</h1><div class="g g3">${p.map(x=>`<a class=card href="#/plan/${x.slug}"><b>${esc(x.name)}</b> ${x.is_demo?'<span class="ch mu">DEMO</span>':''}<p class=mu>${esc(x.summary)}</p><small>${x.documents.length} files · ${x.plan_projects.length} projects</small></a>`).join('')||'<p class=mu>No plans yet.</p>'}</div>`};
R.plan=async s=>{const p=(await ok(sb.from('plans').select('*,documents(*),plan_events(*),plan_projects(projects('+PSEL+'))').eq('slug',s).maybeSingle())).data;if(!p)return '<h1>Not found</h1>';return `<a href="#/plans">← All plans</a><h1>${esc(p.name)}</h1><p>${esc(p.summary)}</p><div class="g g2"><div class=card><h3>Maps, documents, EIA reports &amp; photos</h3>${docs(p.documents)}</div><div class=card><h3>Timeline</h3><div class=tl>${[...p.plan_events].sort((a,b)=>String(b.event_date).localeCompare(a.event_date)).map(e=>`<div><small>${dt(e.event_date)}</small><br>${esc(e.detail)}</div>`).join('')||'<span class=mu>No events.</span>'}</div></div></div><h2>Linked projects</h2><div class="g g3">${p.plan_projects.map(x=>pc(x.projects)).join('')||'<p class=mu>None linked.</p>'}</div>`};
R.map=async()=>{AFT.map=()=>{if(M)M.remove();M=L.map('mp').setView([19.6,72.85],9);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(M);const G=L.layerGroup().addTo(M);
LD=async()=>{G.clearLayers();let r=sb.from('projects').select('id,name,location,status,lat,lng,authority,categories(name)').not('lat','is',null).not('lng','is',null);if(F.cat)r=r.eq('category_id',F.cat);if(F.st)r=r.eq('status',F.st);if(F.q){const q=cl(F.q);r=r.or(`name.ilike.%${q}%,location.ilike.%${q}%`)}const x=await ok(r),b=[];x.data.forEach(p=>{const c=COL[SC[p.status]]||'#888';L.marker([p.lat,p.lng],{icon:L.divIcon({html:`<div class=mkr style="border-color:${c}">${ic(p.categories?.name)}</div>`,className:'',iconSize:[30,30]})}).addTo(G).bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.status)} · ${esc(p.authority||'')}<br><a href="#/project/${p.id}">Open project</a>`);b.push([p.lat,p.lng])});if(b.length)M.fitBounds(b,{maxZoom:13,padding:[30,30]})};AFT.map=LD;LD()};
return `<h1>Infrastructure map</h1><div class=fb>${inp('q','Search location or project…')}${sel('cat','All categories',CATS.map(c=>[c.id,c.name]))}${sel('st','All statuses',ST)}</div><div id=mp></div>`};
/* ---------- admin ---------- */
const ENT={projects:{l:'Project',nm:'name',f:[['name','Project name'],['category_id','Category','cat'],['description','Description','ta'],['district','District'],['location','Location'],['lat','Latitude','n'],['lng','Longitude','n'],['authority','Implementing authority'],['cost_cr','Estimated cost (₹ crore)','n'],['status','Status','s',ST],['expected_completion','Expected completion','date'],['is_demo','Demo record','chk']],fk:'project_id'},
tenders:{l:'Tender',nm:'title',f:[['tender_ref','Tender ID'],['title','Title'],['department','Department'],['est_value_cr','Estimated value (₹ crore)','n'],['location','Location'],['published_on','Published','date'],['deadline','Submission deadline','date'],['status','Status','s',TS],['official_url','Official tender link','url'],['is_demo','Demo record','chk']],fk:'tender_id'},
news:{l:'Article',nm:'headline',f:[['headline','Headline'],['summary','Short description','ta'],['body','Full article','ta'],['published_on','Publication date','date'],['location','Location'],['category','Category'],['source_type','Source type','s',NT],['source_name','Original source'],['source_url','Source URL','url'],['project_id','Related project','proj'],['is_demo','Demo record','chk']]},
plans:{l:'Plan',nm:'name',f:[['slug','URL slug (letters, digits, hyphens)'],['name','Plan name'],['summary','Summary','ta'],['is_demo','Demo record','chk']],fk:'plan_id'}};
const fh=([k,l,t,o],v)=>{let i;const op=a=>a.map(y=>`<option ${v===y?'selected':''}>${esc(y)}</option>`).join('');
if(t==='ta')i=`<textarea name=${k} rows=4>${esc(v)}</textarea>`;else if(t==='s')i=`<select name=${k}>${op(o)}</select>`;else if(t==='cat')i=`<select name=${k}><option value="">— none —</option>${CATS.map(c=>`<option value="${c.id}" ${v==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;else if(t==='proj')i=`<select name=${k}><option value="">— none —</option>${PROJ.map(c=>`<option value="${c.id}" ${v===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;else if(t==='chk')return `<label><input type=checkbox name=${k} ${v?'checked':''}> ${l}</label>`;else i=`<input name=${k} type="${t==='n'?'number" step="any':t==='date'?'date':'text'}" value="${esc(v)}">`;return `<label>${l}</label>${i}`};
async function sv(tb,id){const E=ENT[tb],fe=document.forms.f.elements,o={};for(const[k,,t]of E.f){const e=fe[k];let v=e.value.trim();if(t==='chk')v=e.checked;else if(t==='n')v=v===''?null:parseFloat(v);else if(v==='')v=null;o[k]=v}
if(!o[E.f[0][0]])return toast('The first field is required');if(tb==='tenders'&&o.official_url&&!/^https?:\/\//.test(o.official_url))return toast('Link must start with https://');
try{const r=id==='new'?await ok(sb.from(tb).insert(o).select().single()):await ok(sb.from(tb).update(o).eq('id',id).select().single());if(tb==='tenders'){await sb.from('project_tenders').delete().eq('tender_id',r.data.id);if(fe._pid.value)await ok(sb.from('project_tenders').insert({project_id:fe._pid.value,tender_id:r.data.id}))}AD.edit=r.data.id;toast('Saved');adm()}catch(e){toast('Save failed: '+e.message)}}
async function del(tb,id){if(ROLE!=='super_admin')return toast('Only a super admin can delete');if(!confirm('Delete permanently?'))return;try{await ok(sb.from(tb).delete().eq('id',id));AD.edit=null;toast('Deleted');adm()}catch(e){toast(e.message)}}
async function svTrack(pid,k){const g=n=>document.getElementById(`t_${k}_${n}`).value,s=g('s'),p=Math.max(0,Math.min(100,parseInt(g('p'))||0)),n=g('n').trim();try{await ok(sb.from('project_tracks').upsert({project_id:pid,track:k,status:s,percent:s==='Completed'?100:p,note:n||null}));await ok(sb.from('project_updates').insert({project_id:pid,track:k,note:`${TR[k]}: ${s}, ${s==='Completed'?100:p}%${n?' – '+n:''}`}));toast(TR[k]+' updated');adm()}catch(e){toast(e.message)}}
async function addUpd(pid){const f=document.forms.u.elements;if(!f.note.value.trim())return toast('Write the update first');try{await ok(sb.from('project_updates').insert({project_id:pid,note:f.note.value.trim(),source_url:f.src.value.trim()||null}));toast('Update added');adm()}catch(e){toast(e.message)}}
async function addFact(pid){const f=document.forms.x.elements;if(!f.label.value.trim()||!f.detail.value.trim())return toast('Fact and detail are required');try{await ok(sb.from('project_facts').insert({project_id:pid,label:f.label.value.trim(),detail:f.detail.value.trim(),grade:f.grade.value,source_url:f.src.value.trim()||null}));toast('Fact added');adm()}catch(e){toast(e.message)}}
async function addDoc(tb,id){const E=ENT[tb],f=document.forms.d.elements,file=f.file.files[0],url=f.url.value.trim();if(!f.title.value.trim())return toast('Give the file or link a title');if(!file&&!url)return toast('Choose a file or paste a link');if(url&&!/^https?:\/\//.test(url))return toast('Link must start with https://');if(file&&file.size>10485760)return toast('File is over 10 MB');
try{let path=null;if(file){path=`${tb}/${id}/${Date.now()}-${file.name.replace(/[^\w.-]/g,'_')}`;await ok(sb.storage.from('vvi-files').upload(path,file,{contentType:file.type}))}await ok(sb.from('documents').insert({title:f.title.value.trim(),doc_type:f.type.value,file_path:path,external_url:file?null:url,[E.fk]:id}));toast('Added');adm()}catch(e){toast('Upload failed: '+e.message)}}
async function delDoc(id){if(ROLE!=='super_admin')return toast('Only a super admin can delete');try{await ok(sb.from('documents').delete().eq('id',id));adm()}catch(e){toast(e.message)}}
async function setImg(id){const file=$('#img').files[0];if(!file)return toast('Choose an image');if(file.size>10485760)return toast('File is over 10 MB');try{const p=`news/${id}/${Date.now()}-${file.name.replace(/[^\w.-]/g,'_')}`;await ok(sb.storage.from('vvi-files').upload(p,file,{contentType:file.type}));await ok(sb.from('news').update({image_path:p}).eq('id',id));toast('Image saved');adm()}catch(e){toast(e.message)}}
async function extras(tb,id){let h='';const E=ENT[tb];
if(tb==='projects'){const t=(await ok(sb.from('project_tracks').select('*').eq('project_id',id))).data,fa=(await ok(sb.from('project_facts').select('*').eq('project_id',id))).data;
h+=`<div class=card style="margin-top:12px"><h3>Progress tracks <small>(each saves on its own and logs an update)</small></h3>${Object.keys(TR).map(k=>{const x=t.find(a=>a.track===k)||{status:'Not Started',percent:0};return `<div class=fb><b style="width:190px">${TR[k]}</b><select id=t_${k}_s>${TRS.map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select><input id=t_${k}_p type=number min=0 max=100 value=${x.percent} style="max-width:90px"><input id=t_${k}_n placeholder="Note" value="${esc(x.note)}"><button onclick="svTrack('${id}','${k}')">Save</button></div>`}).join('')}</div>
<form name=u class=card style="margin-top:12px" onsubmit="addUpd('${id}');return false"><h3>Add update note</h3><input name=note placeholder="What changed?"><label>Source link (optional)</label><input name=src placeholder="https://"><p><button>Add update</button></p></form>
<form name=x class=card style="margin-top:12px" onsubmit="addFact('${id}');return false"><h3>Add sourced fact</h3><input name=label placeholder="Fact (e.g. Length)"><label>Detail</label><input name=detail><label>Grade</label><select name=grade>${Object.keys(SC).filter(k=>['Verified','Reported','Sources conflict','Unverified'].includes(k)).map(g=>`<option>${g}</option>`).join('')}</select><label>Source link</label><input name=src placeholder="https://"><p><button>Add fact</button> <small>${fa.length} facts saved</small></p></form>`}
if(E.fk){const d=(await ok(sb.from('documents').select('*').eq(E.fk,id).order('created_at',{ascending:false}))).data;h+=`<form name=d class=card style="margin-top:12px" onsubmit="addDoc('${tb}','${id}');return false"><h3>Photos, documents &amp; links</h3><div class=fb><input name=title placeholder="Title"><select name=type>${DT.map(x=>`<option>${x}</option>`).join('')}</select></div><label>Upload a PDF or image (max 10 MB)</label><input type=file name=file accept="application/pdf,image/jpeg,image/png,image/webp"><label>…or paste a link</label><input name=url placeholder="https://"><p><button>Add</button></p>${d.map(x=>`<div>${x.doc_type==='Photo'&&x.file_path?`<img class=pimg style="max-height:70px" src="${esc(pub(x.file_path))}" alt="">`:''}${esc(x.title)} <small>${x.doc_type}</small> ${ROLE==='super_admin'?`<button type=button class="d" onclick="delDoc('${x.id}')">Delete</button>`:''}</div>`).join('')}</form>`}
if(tb==='news')h+=`<div class=card style="margin-top:12px"><h3>Featured image</h3><input type=file id=img accept="image/jpeg,image/png,image/webp"> <button onclick="setImg('${id}')">Upload image</button></div>`;return h}
async function adm(){const m=$('#main');if(!SES){m.innerHTML=`<h1>Admin login</h1><form name=l class=card style="max-width:380px" onsubmit="login();return false"><label>Email</label><input name=e type=email required><label>Password</label><input name=p type=password required><p><button>Sign in</button></p><small class=mu>Admin access is by invitation only. Public visitors have read-only access.</small></form>`;return}
if(!ROLE){m.innerHTML=`<h1>Admin</h1><div class=card>This account is not an admin. Ask the super admin to add it.</div><p><button class=s onclick="sb.auth.signOut()">Sign out</button></p>`;return}
PROJ=(await ok(sb.from('projects').select('id,name').order('name'))).data;const t=AD.tab;let b='';
try{if(ENT[t]){const E=ENT[t];if(AD.edit){let it={},pid='';if(AD.edit!=='new'){it=(await ok(sb.from(t).select('*').eq('id',AD.edit).single())).data;if(t==='tenders')pid=(await ok(sb.from('project_tenders').select('project_id').eq('tender_id',AD.edit).limit(1))).data[0]?.project_id||''}
b=`<form name=f class=card onsubmit="sv('${t}','${AD.edit}');return false"><h3>${AD.edit==='new'?'Add':'Edit'} ${E.l.toLowerCase()}</h3>${E.f.map(f=>fh(f,it[f[0]])).join('')}${t==='tenders'?`<label>Associated project</label><select name=_pid><option value="">— none —</option>${PROJ.map(c=>`<option value="${c.id}" ${pid===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:''}<p><button>Save</button> <button type=button class=s onclick="AD.edit=null;adm()">Close</button> ${AD.edit!=='new'&&ROLE==='super_admin'?`<button type=button class=d onclick="del('${t}','${AD.edit}')">Delete</button>`:''}</p></form>${AD.edit!=='new'?await extras(t,AD.edit):'<p class=mu>Save first, then add progress, photos, documents and links.</p>'}`}
else{const l=(await ok(sb.from(t).select('*').order('created_at',{ascending:false}).limit(100))).data;b=`<p><button onclick="AD.edit='new';adm()">+ Add ${E.l.toLowerCase()}</button></p>`+l.map(x=>`<div class=card style="margin:6px 0;display:flex;gap:8px;align-items:center"><span style="flex:1"><b>${esc(x[E.nm])}</b> ${x.is_demo?'<span class="ch mu">DEMO</span>':''}</span><button class=s onclick="AD.edit='${x.id}';adm()">Edit</button></div>`).join('')}}
else{const l=(await ok(sb.from('audit_log').select('*').order('changed_at',{ascending:false}).limit(100))).data;b=`<div class=card><h3>Change history</h3><div class=tl>${l.map(a=>`<div><small>${new Date(a.changed_at).toLocaleString('en-IN')}</small><br>${esc(a.action)} in ${esc(a.table_name)}</div>`).join('')||'<span class=mu>No changes yet.</span>'}</div></div>`}}catch(e){b=`<div class=card>Error: ${esc(e.message)}</div>`}
m.innerHTML=`<h1>Admin <small>(${ROLE})</small></h1><div class=tabs>${[...Object.keys(ENT),'audit'].map(x=>`<button class="${x===t?'on':''}" onclick="AD={tab:'${x}',edit:null};adm()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}<button class=s onclick="sb.auth.signOut()">Sign out</button></div>${b}`}
async function login(){const f=document.forms.l.elements;const{error}=await sb.auth.signInWithPassword({email:f.e.value,password:f.p.value});if(error)toast('Sign-in failed: '+error.message)}
R.admin=async()=>{setTimeout(adm,0);return '<p class=mu>Loading…</p>'};
/* ---------- shell ---------- */
async function route(){const[,v='home',id]=location.hash.split('/');if(v!==V.v||id!==V.id){F={page:1};V={v,id};scrollTo(0,0)}
const on=k=>v===k||(k==='projects'&&v==='project')||(k==='news'&&v==='article')||(k==='plans'&&v==='plan');
$('#app').innerHTML=`<header><a class=logo href="#/home">Vasai<b>Virar</b>Infra</a><nav>${[['home','Home'],['projects','Projects'],['map','Map'],['tenders','Tenders'],['plans','Plans'],['news','News'],['admin','Admin']].map(([k,l])=>`<a href="#/${k}" class="${on(k)?'on':''}">${l}</a>`).join('')}</nav><button class=s onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">◐</button></header><main id=main><p class=mu>Loading…</p></main><footer>VasaiVirarInfra · Tracking Development. Connecting Communities.<br>Independent platform, not affiliated with any government body. Verify against official sources.</footer>`;
try{$('#main').innerHTML=await (R[v]||R.home)(id);if(AFT[v]&&(v!=='map'||true))AFT[v]()}catch(e){$('#main').innerHTML=`<div class=card><h3>Could not load data</h3><p>${esc(e.message)}</p></div>`}}
async function boot(){if(!/^https:\/\/.+\.supabase\.co/.test(CFG.url)||CFG.key.startsWith('PASTE')){$('#app').innerHTML='<main><div class=card><h1>Almost ready</h1><p>Open <code>index.html</code>, find <code>const CFG</code> near the top of the script and paste your Supabase Project URL and publishable key, then reload.</p></div></main>';return}
sb=supabase.createClient(CFG.url,CFG.key);CATS=(await sb.from('categories').select('*').order('name')).data||[];
const refresh=async s=>{SES=s;ROLE=null;if(s)ROLE=(await sb.from('admin_users').select('role').maybeSingle()).data?.role||null};await refresh((await sb.auth.getSession()).data.session);sb.auth.onAuthStateChange((_e,s)=>{refresh(s).then(()=>{if(V.v==='admin')adm()})});addEventListener('hashchange',route);route()}
boot();
