:root{--bg:#0a1120;--bg2:#0f1a30;--card:#142038;--bd:#22324f;--tx:#e8edf7;--mu:#97a6c3;--ac:#4da3ff;--ok:#34d399;--pp:#a78bfa;--er:#f87171;--wn:#fbbf24;color-scheme:dark}
:root[data-theme=light]{--bg:#f3f6fb;--bg2:#fff;--card:#fff;--bd:#d7deec;--tx:#0e1a33;--mu:#4f5f7d;--ac:#0b63c5;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:var(--ac);text-decoration:none}h1,h2,h3{margin:.2em 0 .5em;font-family:Georgia,serif}small,.mu{color:var(--mu)}
header{position:sticky;top:0;z-index:1000;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap}.logo{font:800 18px Georgia,serif;color:var(--tx)}.logo b{color:var(--ac)}nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}nav a{padding:6px 10px;border-radius:8px;color:var(--mu)}nav a.on{background:var(--card);color:var(--tx)}
main{max-width:1200px;margin:0 auto;padding:16px 14px 40px}footer{text-align:center;padding:22px;color:var(--mu);border-top:1px solid var(--bd);font-size:13px}
.hero{padding:22px;border:1px solid var(--bd);border-radius:14px;background:linear-gradient(135deg,#12305a,#0a1120 70%);color:#e8edf7;margin-bottom:14px}.hero p{margin:0;color:#b8c7e4}
.g{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:block;color:inherit}.k{font-size:24px;font-weight:800}.k small{display:block;font-size:12px;font-weight:500}
.ch{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid currentColor;margin:0 4px 2px 0}.ok{color:var(--ok)}.ac{color:var(--ac)}.pp{color:var(--pp)}.er{color:var(--er)}.wn{color:var(--wn)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:5px 0}.bar i{display:block;height:100%;background:var(--ac)}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;max-width:100%;min-height:40px}button{cursor:pointer;background:var(--ac);color:#04101f;border:0;font-weight:700}button.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--er)}button:disabled{opacity:.4}
.fb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.fb input{flex:1;min-width:160px}.pg{display:flex;gap:12px;align-items:center;justify-content:center;margin:14px 0}
