R.projects=async(fid)=>{if(fid)F.st=decodeURIComponent(fid);const a=(await ok(sb.from('projects').select('authority,location'))).data;LD=async()=>{let r=sb.from('projects').select(PSEL,{count:'exact'});if(F.q){const q=cl(F.q);r=r.or(`name.ilike.%${q}%,location.ilike.%${q}%,authority.ilike.%${q}%,description.ilike.%${q}%`)}

async function saveBid(id,tid){const g=f=>document.getElementById(`b_${id}_${f}`),n=v=>v===''?null:parseFloat(v),o={tender_id:tid,bid_amount_cr:n(g('a').value),submitted_on:g('d').value||null,status:g('s').value,technical_status:g('t').value,rejection_reason:g('r').value.trim()||null,awarded_amount_cr:n(g('w').value),award_date:g('x').value||null};
try{if(id==='new'){if(!g('c').value)return toast('Choose a contractor');o.contractor_id=g('c').value;await ok(sb.from('tender_bids').insert(o))}else await ok(sb.from('tender_bids').update(o).eq('id',id));toast('Bid saved');adm()}catch(e){toast('Save failed: '+e.message)}}
async function delBid(id){if(ROLE!=='super_admin')return toast('Only a super admin can delete');if(!confirm('Delete this bid?'))return;try{await ok(sb.from('tender_bids').delete().eq('id',id));adm()}catch(e){toast(e.message)}}
/* ---------- part 1: tender page, finance bar, specs, citizen updates ---------- */
const BK='<p><button class=s onclick="history.length>1?history.back():location.hash=\'#/home\'">← Back</button></p>';
const FB=(est,bid,l)=>{if(est==null||bid==null||!nv(est))return '<small class=mu>Comparison Not Available</small>';const p=bid/est*100,red=bid>est,c=red?'var(--er)':'var(--ok)';return `<div><div class=r2><span>${l||'Bid vs estimate'}</span><b>${cr(bid)} of ${cr(est)}</b><small style="color:${c}">${p.toFixed(1)}%</small></div><div class=bar><i style="width:${Math.min(p,100)}%;background:${c}"></i></div>${red?`<small style="color:${c}">Above the estimate by ${(p-100).toFixed(1)}%</small>`:''}</div>`};
const SPV=x=>x.value==null||x.value===''?'Not Available':x.kind==='amount'?cr(+x.value):x.kind==='percentage'?x.value+'%':x.kind==='date'?dt(x.value):x.value;
const cu=u=>`${u.contributor_name?`<br><small>Community update · credit: ${esc(u.contributor_name)}</small>`:''}${(u.photos||[]).map(ph=>`<a href="${esc(pub(ph))}" target=_blank rel=noopener><img class=pimg src="${esc(pub(ph))}" alt="Community photo" loading=lazy></a>`).join('')}`;
R.tender=async id=>{const t=(await ok(sb.from('tenders').select('*,agencies(id,name),documents(*),project_tenders(projects(id,name)),tender_bids(*,contractors(id,name,contractor_ref))').eq('id',id).maybeSingle())).data;if(!t)return '<h1>Not found</h1>';const w=t.tender_bids.find(b=>b.status==='Awarded');
return `<h1>${esc(t.title)}</h1>${chip(t.status)}<small class=mu> ${esc(t.tender_ref)}</small><div class="g g2" style="margin-top:10px"><div class=card><h3>Tender details</h3><p>${esc(t.description||'Description Not Available')}</p><p><b>Estimated value:</b> ${cr(t.est_value_cr)}<br><b>Department:</b> ${esc(t.department||'Not Available')}<br><b>Issuing authority:</b> ${esc(t.issuing_authority||'Not Available')}<br><b>Agency:</b> ${t.agencies?gl('agency/'+t.agencies.id,t.agencies.name):'Not Available'}<br><b>Location:</b> ${esc(t.location||'Not Available')}<br><b>Published:</b> ${dt(t.published_on)}<br><b>Submission deadline:</b> ${dt(t.deadline)}<br><b>Opening date:</b> ${dt(t.opening_date)}<br><b>Awarded contractor:</b> ${w?gl('contractor/'+w.contractors.id,w.contractors.name):'Not awarded / Not Available'}<br><b>Awarded amount:</b> ${w?cr(w.awarded_amount_cr):'Not Available'}</p>${t.official_url?`<p><a href="${safe(t.official_url)}" target=_blank rel=noopener>Official tender link ↗</a></p>`:''}<h3>Projects</h3>${t.project_tenders.map(p=>gl('project/'+p.projects.id,p.projects.name)).join('<br>')||'<span class=mu>None linked.</span>'}</div><div class=card><h3>Documents &amp; attachments</h3>${docs(t.documents)}</div></div><div class=card style="margin-top:12px"><h3>Contractors &amp; results</h3>${t.tender_bids.map(b=>`<div style="margin:10px 0">${gl('contractor/'+b.contractors.id,b.contractors.name)} <small>${esc(b.contractors.contractor_ref||'')}</small> ${bchip(b.status)}${FB(t.est_value_cr,b.bid_amount_cr)}</div>`).join('')||'<span class=mu>No contractors recorded.</span>'}</div>`};
R.submit=async pid=>{const ps=(await ok(sb.from('projects').select('id,name').order('name'))).data;return `<h1>Submit a project update</h1><p class=mu>Share new information or photographs about a project. The administrator reviews every update before anything is published. Your contact details are never shown publicly.</p><form name=su class=card style="max-width:640px" onsubmit="subm();return false"><label>Project *</label><select name=p required><option value="">Select a project…</option>${ps.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select><label>Update description *</label><textarea name=d rows=5 required minlength=10 maxlength=4000 placeholder="What did you observe? Include the date and exact location."></textarea><label>Photographs (JPG, PNG or WEBP; up to 10 files, 50 MB each)</label><input type=file name=f multiple accept="image/jpeg,image/png,image/webp"><label>Your name (shown as credit) *</label><input name=n required minlength=2 maxlength=100><label>Contributor ID (optional)</label><input name=r maxlength=100><label>Contact email or phone (optional, kept private)</label><input name=c maxlength=200><input name=website tabindex=-1 autocomplete=off style="position:absolute;left:-9999px" aria-hidden=true><p><button id=sb2>Submit for verification</button></p></form>`};
async function subm(){const f=document.forms.su.elements;if(f.website.value)return $('#main').innerHTML='<div class=card><h2>Thank you</h2><p>Your update was submitted for verification.</p></div>';const fl=[...f.f.files];if(fl.length>10)return toast('Please choose at most 10 photographs');for(const x of fl){if(!['image/jpeg','image/png','image/webp'].includes(x.type))return toast('“'+x.name+'” is not a JPG, PNG or WEBP image');if(x.size>MAXB)return toast('“'+x.name+'” is over '+MAXMB+' MB')}
const b=$('#sb2');b.disabled=true;b.textContent='Uploading…';const id=crypto.randomUUID(),ph=[];try{for(let i=0;i<fl.length;i++){const p=`${id}/${i}-${fl[i].name.replace(/[^\w.-]/g,'_')}`;await ok(sb.storage.from('vvi-submissions').upload(p,fl[i],{contentType:fl[i].type}));ph.push(p)}
await ok(sb.from('update_submissions').insert({id,project_id:f.p.value,description:f.d.value.trim(),contributor_name:f.n.value.trim(),contributor_ref:f.r.value.trim()||null,contributor_contact:f.c.value.trim()||null,photo_paths:ph}));$('#main').innerHTML='<div class=card><h2>Thank you</h2><p>Your update was submitted for verification. It will appear on the project page only after the administrator approves it.</p><a href="#/projects"><button>Back to projects</button></a></div>'}catch(e){b.disabled=false;b.textContent='Submit for verification';toast('Submission failed: '+e.message)}}
async function subPanel(){const l=(await ok(sb.from('update_submissions').select('*,projects(name)').order('created_at',{ascending:false}).limit(100))).data;l.sort((a,b)=>(a.status==='Pending'?0:1)-(b.status==='Pending'?0:1));const rows=[];for(const s of l){const u=s.photo_paths.length?(await sb.storage.from('vvi-submissions').createSignedUrls(s.photo_paths,3600)).data||[]:[];
rows.push(`<div class=card style="margin:8px 0"><b>${esc(s.projects.name)}</b> ${chip(s.status)}<br><small>${esc(s.contributor_name)}${s.contributor_ref?' · ID '+esc(s.contributor_ref):''}${s.contributor_contact?' · '+esc(s.contributor_contact):''} · ${new Date(s.created_at).toLocaleString('en-IN')}</small><p>${esc(s.description)}</p>${u.map(x=>x.signedUrl?`<a href="${esc(x.signedUrl)}" target=_blank rel=noopener><img class=pimg style="max-height:110px" src="${esc(x.signedUrl)}" alt=""></a>`:'').join('')}${s.admin_note?`<p><small>Note: ${esc(s.admin_note)}</small></p>`:''}${s.status==='Pending'||s.status==='Changes Requested'?`<input id=sn_${s.id} placeholder="Note (required to reject or request changes)"><div class=fb><button onclick="rev('${s.id}','a')">Approve &amp; publish</button><button class=d onclick="rev('${s.id}','r')">Reject</button><button class=s onclick="rev('${s.id}','c')">Request changes</button></div>`:''}</div>`)}return '<h3>Citizen updates (pending first)</h3>'+(rows.join('')||'<p class=mu>No submissions yet.</p>')}
async function rev(id,a){const s=(await ok(sb.from('update_submissions').select('*').eq('id',id).single())).data,note=$('#sn_'+id).value.trim();if(a!=='a'&&!note)return toast('Add a note first');
try{if(a==='a'){const np=[];for(const p of s.photo_paths){const d=`updates/${id}/${p.split('/').pop()}`;await ok(sb.storage.from('vvi-submissions').copy(p,d,{destinationBucket:'vvi-files'}));np.push(d)}await ok(sb.from('project_updates').insert({project_id:s.project_id,note:s.description,contributor_name:s.contributor_name,photos:np}))}
await ok(sb.from('update_submissions').update({status:a==='a'?'Approved':a==='r'?'Rejected':'Changes Requested',admin_note:note||null,reviewed_by:SES.user.id,reviewed_at:new Date().toISOString()}).eq('id',id));toast('Done');adm()}catch(e){toast('Failed: '+e.message)}}
async function specPanel(pid){const sp=(await ok(sb.from('project_specs').select('*').eq('project_id',pid).order('sort_order'))).data,K=['text','number','date','percentage','amount'],row=(x,k)=>{const i=f=>`s_${k}_${f}`;return `<div class=fb><input id=${i('l')} placeholder="Field name (e.g. Road width)" value="${esc(x.label)}"><select id=${i('k')}>${K.map(z=>`<option ${x.kind===z?'selected':''}>${z}</option>`).join('')}</select><input id=${i('v')} placeholder="Value" value="${esc(x.value)}"><button onclick="saveSpec('${k}','${pid}')">${k==='new'?'Add field':'Save'}</button>${k!=='new'?`<button class=d onclick="delSpec('${x.id}')">Remove</button>`:''}</div>`};
return `<div class=card style="margin-top:12px"><h3>Project specifications <small>(custom fields)</small></h3><p class=mu>Add any fields this project needs, rename them or remove them. Amounts are in ₹ crore.</p>${sp.map(x=>row(x,x.id)).join('')}<h3>Add a field</h3>${row({},'new')}</div>`}
async function saveSpec(id,pid){const g=f=>document.getElementById(`s_${id}_${f}`);if(!g('l').value.trim())return toast('Field name is required');const o={project_id:pid,label:g('l').value.trim(),kind:g('k').value,value:g('v').value.trim()||null};if(['number','amount','percentage'].includes(o.kind)&&o.value&&isNaN(+o.value))return toast('Value must be a number');try{if(id==='new')await ok(sb.from('project_specs').insert(o));else await ok(sb.from('project_specs').update(o).eq('id',id));toast('Saved');adm()}catch(e){toast(e.message)}}
async function delSpec(id){if(ROLE!=='super_admin')return toast('Only a super admin can delete');if(!confirm('Remove this field?'))return;try{await ok(sb.from('project_specs').delete().eq('id',id));adm()}catch(e){toast(e.message)}}

const ENT={projects:{l:'Project',nm:'name',f:[['name','Project name'],['category_id','Category','cat'],['description','Description','ta'],['district','District'],['location','Location'],['lat','Latitude','n'],['lng','Longitude','n'],['authority','Implementing authority'],['cost_cr','Estimated cost (₹ crore)','n'],['status','Status','s',ST],['expected_completion','Expected completion','date'],['is_demo','Demo record','chk']],fk:'project_id'},
tenders:{l:'Tender',nm:'title',f:[['tender_ref','Tender ID'],['title','Title'],['description','Description','ta'],['issuing_authority','Issuing authority'],['opening_date','Opening date','date'],['agency_id','Issuing agency (add agencies in the Agencies tab first)','agency'],['department','Department name'],['state','State / location'],['est_value_cr','Estimated value (₹ crore)','n'],['location','Location'],['published_on','Published','date'],['deadline','Submission deadline','date'],['status','Status','s',TS],['official_url','Official tender link','url'],['is_demo','Demo record','chk']],fk:'tender_id'},

const fh=([k,l,t,o],v)=>{let i;const op=a=>a.map(y=>`<option ${v===y?'selected':''}>${esc(y)}</option>`).join('');
if(t==='ta')i=`<textarea name=${k} rows=4>${esc(v)}</textarea>`;else if(t==='s')i=`<select name=${k}>${op(o)}</select>`;else if(t==='cat')i=`<select name=${k}><option value="">— none —</option>${CATS.map(c=>`<option value="${c.id}" ${v==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;else if(t==='agency')i=`<select name=${k}><option value="">— none —</option>${AGS.map(c=>`<option value="${c.id}" ${v===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;else if(t==='proj')i=`<select name=${k}><option value="">— none —</option>${PROJ.map(c=>`<option value="${c.id}" ${v===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;else if(t==='chk')return `<label><input type=checkbox name=${k} ${v?'checked':''}> ${l}</label>`;else i=`<input name=${k} type="${t==='n'?'number" step="any':t==='date'?'date':'text'}" value="${esc(v)}">`;return `<label>${l}</label>${i}`};
async function sv(tb,id){const E=ENT[tb],fe=document.forms.f.elements,o={};for(const[k,,t]of E.f){const e=fe[k];let v=e.value.trim();if(t==='chk')v=e.checked;else if(t==='n')v=v===''?null:parseFloat(v);else if(v==='')v=null;o[k]=v}
if(!o[E.f[0][0]])return toast('The first field is required');if(tb==='tenders'&&o.official_url&&!/^https?:\/\//.test(o.official_url))return toast('Link must start with https://');
try{const r=id==='new'?await ok(sb.from(tb).insert(o).select().single()):await ok(sb.from(tb).update(o).eq('id',id).select().single());if(tb==='tenders'){await sb.from('project_tenders').delete().eq('tender_id',r.data.id);if(fe._pid.value)await ok(sb.from('project_tenders').insert({project_id:fe._pid.value,tender_id:r.data.id}))}AD.edit=r.data.id;toast('Saved');adm()}catch(e){toast('Save failed: '+e.message)}}
async function del(tb,id){if(ROLE!=='super_admin')return toast('Only a super admin can delete');if(!confirm('Delete permanently?'))return;try{await ok(sb.from(tb).delete().eq('id',id));AD.edit=null;toast('Deleted');adm()}catch(e){toast(e.message)}}
async function svTrack(pid,k){const g=n=>document.getElementById(`t_${k}_${n}`).value,s=g('s'),p=Math.max(0,Math.min(100,parseInt(g('p'))||0)),n=g('n').trim();try{await ok(sb.from('project_tracks').upsert({project_id:pid,track:k,status:s,percent:s==='Completed'?100:p,note:n||null}));await ok(sb.from('project_updates').insert({project_id:pid,track:k,note:`${TR[k]}: ${s}, ${s==='Completed'?100:p}%${n?' – '+n:''}`}));toast(TR[k]+' updated');adm()}catch(e){toast(e.message)}}
async function addUpd(pid){const f=document.forms.u.elements;if(!f.note.value.trim())return toast('Write the update first');try{await ok(sb.from('project_updates').insert({project_id:pid,note:f.note.value.trim(),source_url:f.src.value.trim()||null}));toast('Update added');adm()}catch(e){toast(e.message)}}
async function addFact(pid){const f=document.forms.x.elements;if(!f.label.value.trim()||!f.detail.value.trim())return toast('Fact and detail are required');try{await ok(sb.from('project_facts').insert({project_id:pid,label:f.label.value.trim(),detail:f.detail.value.trim(),grade:f.grade.value,source_url:f.src.value.trim()||null}));toast('Fact added');adm()}catch(e){toast(e.message)}}
async function addDoc(tb,id){const E=ENT[tb],f=document.forms.d.elements,file=f.file.files[0],url=f.url.value.trim();if(!f.title.value.trim())return toast('Give the file or link a title');if(!file&&!url)return toast('Choose a file or paste a link');if(url&&!/^https?:\/\//.test(url))return toast('Link must start with https://');if(file&&file.size>MAXB)return toast('File is over '+MAXMB+' MB');
try{let path=null;if(file){path=`${tb}/${id}/${Date.now()}-${file.name.replace(/[^\w.-]/g,'_')}`;await ok(sb.storage.from('vvi-files').upload(path,file,{contentType:file.type}))}await ok(sb.from('documents').insert({title:f.title.value.trim(),doc_type:f.type.value,file_path:path,external_url:file?null:url,[E.fk]:id}));toast('Added');adm()}catch(e){toast('Upload failed: '+e.message)}}
async function delDoc(id){if(ROLE!=='super_admin')return toast('Only a super admin can delete');try{await ok(sb.from('documents').delete().eq('id',id));adm()}catch(e){toast(e.message)}}
async function setImg(id){const file=$('#img').files[0];if(!file)return toast('Choose an image');if(file.size>MAXB)return toast('File is over '+MAXMB+' MB');try{const p=`news/${id}/${Date.now()}-${file.name.replace(/[^\w.-]/g,'_')}`;await ok(sb.storage.from('vvi-files').upload(p,file,{contentType:file.type}));await ok(sb.from('news').update({image_path:p}).eq('id',id));toast('Image saved');adm()}catch(e){toast(e.message)}}
async function extras(tb,id){let h='';const E=ENT[tb];
if(tb==='projects'){const t=(await ok(sb.from('project_tracks').select('*').eq('project_id',id))).data,fa=(await ok(sb.from('project_facts').select('*').eq('project_id',id))).data;
h+=`<div class=card style="margin-top:12px"><h3>Progress tracks <small>(each saves on its own and logs an update)</small></h3>${Object.keys(TR).map(k=>{const x=t.find(a=>a.track===k)||{status:'Not Started',percent:0};return `<div class=fb><b style="width:190px">${TR[k]}</b><select id=t_${k}_s>${TRS.map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select><input id=t_${k}_p type=number min=0 max=100 value=${x.percent} style="max-width:90px"><input id=t_${k}_n placeholder="Note" value="${esc(x.note)}"><button onclick="svTrack('${id}','${k}')">Save</button></div>`}).join('')}</div>
<form name=u class=card style="margin-top:12px" onsubmit="addUpd('${id}');return false"><h3>Add update note</h3><input name=note placeholder="What changed?"><label>Source link (optional)</label><input name=src placeholder="https://"><p><button>Add update</button></p></form>
<form name=x class=card style="margin-top:12px" onsubmit="addFact('${id}');return false"><h3>Add sourced fact</h3><input name=label placeholder="Fact (e.g. Length)"><label>Detail</label><input name=detail><label>Grade</label><select name=grade>${Object.keys(SC).filter(k=>['Verified','Reported','Sources conflict','Unverified'].includes(k)).map(g=>`<option>${g}</option>`).join('')}</select><label>Source link</label><input name=src placeholder="https://"><p><button>Add fact</button> <small>${fa.length} facts saved</small></p></form>`}
if(tb==='projects')h+=await specPanel(id);if(E.fk){const d=(await ok(sb.from('documents').select('*').eq(E.fk,id).order('created_at',{ascending:false}))).data;h+=`<form name=d class=card style="margin-top:12px" onsubmit="addDoc('${tb}','${id}');return false"><h3>Photos, documents &amp; links</h3><div class=fb><input name=title placeholder="Title"><select name=type>${DT.map(x=>`<option>${x}</option>`).join('')}</select></div><label>Upload a file: PDF, Word, Excel, PowerPoint, image, ZIP, CSV or MP4 (max 50 MB)</label><input type=file name=file accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.csv,.txt,.kml,.mp4,image/jpeg,image/png,image/webp,image/gif"><label>…or paste a link</label><input name=url placeholder="https://"><p><button>Add</button></p>${d.map(x=>`<div>${x.doc_type==='Photo'&&x.file_path?`<img class=pimg style="max-height:70px" src="${esc(pub(x.file_path))}" alt="">`:''}${esc(x.title)} <small>${x.doc_type}</small> ${ROLE==='super_admin'?`<button type=button class="d" onclick="delDoc('${x.id}')">Delete</button>`:''}</div>`).join('')}</form>`}
